<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1130" viewBox="0 0 960 1130" role="img" aria-labelledby="title desc">
<title id="title">School Insight system architecture</title>
<desc id="desc">Users access a Next.js frontend and authenticated FastAPI backend. LangGraph routes questions through validated PostgreSQL reports or document retrieval with pgvector. Answers stream to the interface. Redis and Celery support document indexing and backups.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="1130" rx="24" fill="#f8fafc"/>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-size:26px;font-weight:700;fill:#0f172a} .label{font-size:18px;font-weight:700;fill:#0f172a} .detail{font-size:15px;fill:#475569} .small{font-size:13px;fill:#475569} .edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
