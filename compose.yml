services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: ${PRODUCT_POSTGRES_PASSWORD:?Set PRODUCT_POSTGRES_PASSWORD}
      POSTGRES_DB: school_ai
    ports: ["127.0.0.1:55433:5432"]
    volumes: ["school_ai_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_ai"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["school_ai_redis:/data"]
volumes:
  school_ai_postgres:
  school_ai_redis:
